name: Build project
on:
  push:
    tags:
      - '*'
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  project:
    runs-on: ubuntu-latest
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
    - name: Check RStudio version bump (dry-run)
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash ./version-bump.sh --dry-run
    - name: Verify RStudio download
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm2cpio cpio
        unset TOOL_PROJECT_URL RSTUDIO_VERSION
        bash ./download_rstudio.sh
        rm -f rs-rhel8-x86_64.rpm rs-rhel9-x86_64.rpm rs-rhel9-aarch64.rpm
    - name: Build the archive
      run: |
        source $CONDA/bin/activate
        conda install -y ae-dev::anaconda-project
        anaconda-project archive rstudio-installer.tar.bz2
    - name: Upload archive
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
      run: |
        SUFFFIX2="no"
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          SUFFIX=-$GITHUB_REF_NAME
        elif [ -z "$GITHUB_HEAD_REF" ]; then
          SUFFIX=-dev
        else
          SUFFIX=-test
        fi
        URL=s3://airgap-svc/misc
        ARGS="--acl public-read --region $AWS_DEFAULT_REGION"
        for sfx in "$SUFFIX" "$SUFFIX2"; do
          aws s3 cp rstudio-installer.tar.bz2 $URL/rstudio-installer$sfx.tar.bz2 $ARGS
          aws s3 cp README.pdf $URL/rstudio-install$sfx.pdf $ARGS
          aws s3 cp TOOLS.pdf $URL/tools-volume$sfx.pdf $ARGS
          if [ "$SUFFIX2" = "no" ]; then break; fi
        done
    - name: Retain installer for suffix-free publish
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: installer-release
        path: |
          rstudio-installer.tar.bz2
          README.pdf
          TOOLS.pdf

  bringup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Retrieve the source code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Log in to gcr.io
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
      with:
        registry: gcr.io
        username: _json_key
        password: ${{ secrets.AE_GCR_KEY }}
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: '22'
    - name: Install Playwright
      run: |
        npm install @playwright/test@^1.63.0
        npx playwright install --with-deps chromium
    - name: Run RStudio bringup test
      id: bringup
      env:
        GH_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
      run: bash ./ci_test.sh
    - name: Upload screenshot artifact
      if: always() && hashFiles('test_screenshot.png') != ''
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      with:
        name: rstudio-bringup-screenshot
        path: test_screenshot.png
    - name: Push screenshot branch
      if: always() && github.event_name == 'pull_request' && hashFiles('test_screenshot.png') != ''
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        RUN_ID: ${{ github.run_id }}
      run: |
        set -euo pipefail
        branch="ci-screenshots/pr-${PR_NUMBER}"
        workdir=$(mktemp -d)
        cp test_screenshot.png "$workdir/"
        cd "$workdir"
        git init
        git checkout -b "$branch"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add test_screenshot.png
        git commit -m "RStudio bringup screenshot PR ${PR_NUMBER} run ${RUN_ID}"
        git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${branch}"
    - name: Post or update screenshot comment
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        IMAGE_VER: ${{ steps.bringup.outputs.image_ver }}
        RSTUDIO_VER: ${{ steps.bringup.outputs.expected_version }}
      with:
        script: |
          const fs = require('fs');
          const marker = '<!-- rstudio-bringup-screenshot -->';
          const pr = context.payload.pull_request.number;
          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const imageVer = process.env.IMAGE_VER || 'unknown';
          const rstudioVer = process.env.RSTUDIO_VER || 'unknown';
          const pngExists = fs.existsSync('test_screenshot.png');
          const meta = `Image: \`ae-editor-base:${imageVer}\` · RStudio \`${rstudioVer}\` · [run](${runUrl})`;
          let body;
          if (pngExists) {
            const img = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/ci-screenshots/pr-${pr}/test_screenshot.png?raw=true&t=${context.runId}`;
            body = `${marker}\n## RStudio bringup\n\n${meta}\n\n![RStudio bringup](${img})\n`;
          } else {
            body = `${marker}\n## RStudio bringup\n\nBringup **failed** before a screenshot was captured.\n\n${meta}\n`;
          }
          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: pr,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body,
            });
          }

  publish-latest:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [project, bringup]
    runs-on: ubuntu-latest
    steps:
    - name: Download installer archive
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
      with:
        name: installer-release
    - name: Publish suffix-free installer
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{secrets.AWS_DEFAULT_REGION}}
      run: |
        URL=s3://airgap-svc/misc
        ARGS="--acl public-read --region $AWS_DEFAULT_REGION"
        aws s3 cp rstudio-installer.tar.bz2 $URL/rstudio-installer.tar.bz2 $ARGS
        aws s3 cp README.pdf $URL/rstudio-install.pdf $ARGS
        aws s3 cp TOOLS.pdf $URL/tools-volume.pdf $ARGS
